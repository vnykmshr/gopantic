name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        type: string

env:
  GO_VERSION: '1.25'

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Install development tools
      run: make install

    - name: Check for security vulnerabilities
      run: |
        echo "Running govulncheck to ensure no known vulnerabilities..."
        go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    - name: Run full release validation
      run: make release

    - name: Run comprehensive benchmarks
      run: |
        echo "Running pre-release performance validation..."
        make bench-full

    - name: Test all examples
      run: |
        echo "Validating all examples work correctly..."
        make examples

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: validate-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Get release version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Run release benchmarks
      run: |
        echo '```' > BENCHMARKS.md
        make bench-compare >> BENCHMARKS.md 2>&1
        echo '```' >> BENCHMARKS.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.version }}
        generate_release_notes: true
        files: |
          BENCHMARKS.md